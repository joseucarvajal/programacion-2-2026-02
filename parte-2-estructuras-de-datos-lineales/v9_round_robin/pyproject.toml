[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "round-robin-tienda"
version = "1.0.0"
description = "API de las colas de la tienda con rotacion Round Robin ponderada"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# pythonpath evita tener que instalar el paquete para correr los tests.
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"